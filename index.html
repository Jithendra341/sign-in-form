<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>validation</title>
  </head>
  <link rel="stylesheet" href="style.css">
  <body>
    <div class="container">
      <div class="header">
        <h1>Create account</h1>
      </div>
      <form class="form" id="form">
        <div class="form-control">
          <label>Username</label>
          <input type="text" placeholder="jithendra" id="Username">
          <small>Error</small>
        </div>
        <div class="form-control">
          <label>Email</label>
          <input type="text" placeholder="jithendrabathula@gmail.com" id="email">
          <small>Error</small>
        </div>
        <div class="form-control">
          <label>Password</label>
          <input type="password" placeholder="password" id="password">
          <small>Error</small>
        </div>
        <div class="form-control">
          <label>Retype-password</label>
          <input type="password" placeholder="password " id="password2">
          <small>Error</small>
        </div>

        <button onClick="password()">Submit</button>

      </form>

    </div>
    <scriptsrc="app.js">

    </script>

  </body>
</html>
